name: Compilar y probar
on:
  push:
  pull_request:
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas y empaquetado
        run: mvn -B clean verify
