spring.application.name=GimnasioWeb
server.port=${PORT:8080}
spring.thymeleaf.cache=false

# El usuario y la clave vienen de variables de entorno; no subir contrasenas.
gimnasio.db.url=${DB_URL:jdbc:mysql://localhost:3306/gimnasio_web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
gimnasio.db.user=${DB_USER:root}
gimnasio.db.password=${DB_PASSWORD:}
