<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Socios')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-5">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div><p class="seccion-titulo">GESTIÓN DE PERSONAS</p><h1 class="h2 fw-bold mb-0">Socios</h1></div>
    <a th:href="@{/socios/nuevo}" class="btn btn-primary">+ Registrar socio</a>
  </div>
  <div th:replace="~{fragmentos :: avisos}"></div>
  <form class="card filtro p-3 mb-4" method="get" th:action="@{/socios}">
    <div class="row g-2"><div class="col-md-9"><input type="search" class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar por nombre, apellido o DNI" aria-label="Buscar socio"></div>
    <div class="col-md-3 d-grid"><button class="btn btn-dark" type="submit">Buscar / filtrar</button></div></div>
  </form>
  <div class="card bloque"><div class="table-responsive"><table class="table tabla align-middle mb-0">
    <thead><tr><th>ID</th><th>Apellido y nombre</th><th>DNI</th><th>Contacto</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>
      <tr th:each="s : ${socios}">
        <td th:text="${s.id}">1</td>
        <td class="fw-semibold" th:text="${s.nombreCompleto()}">Apellido, nombre</td>
        <td th:text="${s.dni}">12345678</td>
        <td><div th:text="${s.email}">correo@ejemplo.com</div><small class="text-muted" th:text="${s.telefono}">299</small></td>
        <td><span class="badge" th:classappend="${s.activo} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${s.activo} ? 'Activo' : 'Inactivo'">Activo</span></td>
        <td><div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-sm btn-outline-primary" th:href="@{/socios/{id}/editar(id=${s.id})}">Editar</a>
          <form method="post" th:action="@{/socios/{id}/eliminar(id=${s.id})}" onsubmit="return confirm('¿Eliminar este socio? Si tiene inscripciones, no se podrá eliminar.');"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
        </div></td>
      </tr>
      <tr th:if="${#lists.isEmpty(socios)}"><td colspan="6" class="text-center text-muted py-5">No hay socios que coincidan con la búsqueda.</td></tr>
    </tbody>
  </table></div></div>
</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body></html>
