<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Formulario de socio')}"></head>
<body><nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-5 contenedor-formulario">
  <a th:href="@{/socios}" class="text-decoration-none small">← Volver a socios</a>
  <h1 class="h2 fw-bold mt-3 mb-4" th:text="${titulo}">Nuevo socio</h1>
  <div th:replace="~{fragmentos :: avisos}"></div>
  <form th:action="@{/socios/guardar}" th:object="${form}" method="post" class="card bloque p-4 p-md-5">
    <input type="hidden" th:field="*{id}">
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label" for="nombre">Nombre *</label><input id="nombre" class="form-control" th:field="*{nombre}" maxlength="70" required><div class="error-campo" th:errors="*{nombre}"></div></div>
      <div class="col-md-6"><label class="form-label" for="apellido">Apellido *</label><input id="apellido" class="form-control" th:field="*{apellido}" maxlength="70" required><div class="error-campo" th:errors="*{apellido}"></div></div>
      <div class="col-md-6"><label class="form-label" for="dni">DNI *</label><input id="dni" class="form-control" th:field="*{dni}" inputmode="numeric" maxlength="10" required><div class="error-campo" th:errors="*{dni}"></div></div>
      <div class="col-md-6"><label class="form-label" for="email">Correo electrónico *</label><input id="email" class="form-control" th:field="*{email}" type="email" maxlength="120" required><div class="error-campo" th:errors="*{email}"></div></div>
      <div class="col-md-6"><label class="form-label" for="telefono">Teléfono</label><input id="telefono" class="form-control" th:field="*{telefono}" maxlength="30"><div class="error-campo" th:errors="*{telefono}"></div></div>
      <div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input id="activo" class="form-check-input" type="checkbox" th:field="*{activo}"><label class="form-check-label" for="activo">Socio activo</label></div></div>
    </div>
    <div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">Guardar socio</button><a class="btn btn-outline-secondary" th:href="@{/socios}">Cancelar</a></div>
  </form>
</main><footer th:replace="~{fragmentos :: pie}"></footer>
</body></html>
