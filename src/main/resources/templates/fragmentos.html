<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | GimnasioWeb'">GimnasioWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark barra">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">● Gimnasio<span class="marca">Web</span></a>
        <div class="d-flex flex-wrap gap-2">
            <a class="nav-enlace" th:href="@{/}">Inicio</a>
            <a class="nav-enlace" th:href="@{/socios}">Socios</a>
            <a class="nav-enlace" th:href="@{/actividades}">Actividades</a>
            <a class="nav-enlace" th:href="@{/inscripciones}">Inscripciones</a>
        </div>
    </div>
</nav>
<div th:fragment="avisos" class="mb-4">
    <div th:if="${exito}" class="alert alert-success border-0 shadow-sm" role="status" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger border-0 shadow-sm" role="alert" th:text="${error}"></div>
</div>
<footer th:fragment="pie" class="container text-center mt-5 mb-4 small text-muted">
    GimnasioWeb · Proyecto Integrador · Spring Boot + MVC + Thymeleaf + JDO
</footer>
</body>
</html>
